<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f4f6" id="cor-tema">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <meta name="application-name" content="Finanças">
  <title>Phaze Finanças</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icone-180.png">
  <link rel="manifest" href="/manifest.json">
  <script src="/tema.js?v=1"></script>
  <link rel="stylesheet" href="/painel.css?v=4">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-painel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
      <symbol id="i-grafico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-lista" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-3-2-2 2-2-2-2 2-2-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></symbol>
      <symbol id="i-calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
      <symbol id="i-carteira" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h12v4"/><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M16 13.5h.01" stroke-linecap="round"/></symbol>
      <symbol id="i-sair" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></symbol>
      <symbol id="i-atualizar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
      <symbol id="i-busca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-baixar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
      <symbol id="i-exportar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
      <symbol id="i-mais" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-fechar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-filtro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
      <symbol id="i-lixo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-moeda" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3.1-1.6M12 6.5v1.5M12 16v1.5"/></symbol>
      <symbol id="i-sacola" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
      <symbol id="i-etiqueta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></symbol>
      <symbol id="i-cadeado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-relogio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-recibo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18l-5-3-5 3z"/></symbol>
      <symbol id="i-controle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10a5 5 0 0 1 4.9 6l-.6 3a2.5 2.5 0 0 1-4.3 1.2L15 15H9l-2 2.2A2.5 2.5 0 0 1 2.7 16l-.6-3A5 5 0 0 1 7 7z"/><path d="M8 10v3M6.5 11.5h3M16 11h.01M18 12.5h.01"/></symbol>
      <symbol id="i-celular" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18h2"/></symbol>
    </defs>
  </svg>

  <main id="tela-login" class="login" hidden>
    <form id="form-login" class="login-card" autocomplete="on">
      <div class="marca"><img class="logo" src="/logo.webp" alt="Phaze Games" width="121" height="144"><span>Phaze Games<small>Finanças</small></span></div>
      <h1>Entrar</h1>
      <p class="sub">Painel financeiro, só para admin.</p>
      <input id="usuario" class="campo-entrada" name="username" autocomplete="username" placeholder="Usuário" required>
      <input id="senha" class="campo-entrada" name="password" type="password" autocomplete="current-password" placeholder="Senha" required>
      <p id="erro-login" class="erro" hidden></p>
      <button type="submit" class="btn primario grande cheio toque">Entrar</button>
    </form>
  </main>

  <div id="app" hidden>
    <aside id="menu" class="menu" aria-label="Menu">
      <div class="marca"><img class="logo" src="/logo.webp" alt="Phaze Games" width="121" height="144"><span>Phaze Games<small>Finanças</small></span></div>
      <button class="nav-item toque ativo" data-ir="geral"><svg class="icone"><use href="#i-painel"/></svg>Visão geral</button>
      <button class="nav-item toque" data-ir="pedidos"><svg class="icone"><use href="#i-lista"/></svg>Pedidos</button>
      <p class="menu-titulo">Dinheiro</p>
      <button class="nav-item toque" data-ir="receber"><svg class="icone"><use href="#i-calendario"/></svg>A receber</button>
      <button class="nav-item toque" data-ir="despesas"><svg class="icone"><use href="#i-carteira"/></svg>Despesas e sócios</button>
      <div class="rodape">
        <button class="nav-item toque" id="btn-sair"><svg class="icone"><use href="#i-sair"/></svg>Sair</button>
        <button class="cartao-app toque" id="btn-instalar">
          <span class="icone-app"><svg class="icone p"><use href="#i-celular"/></svg></span>
          <b>Finanças no celular</b>
          <small>Instale o app e acompanhe as vendas de qualquer lugar.</small>
          <span class="falso-botao">Instalar o app</span>
        </button>
        <p class="versao" id="sync-info"></p>
      </div>
    </aside>
    <div id="veu" class="veu"></div>

    <div class="principal">
      <header id="topo" class="topo">
        <button class="icone-btn so-celular toque" id="btn-menu" aria-label="Abrir menu"><svg class="icone"><use href="#i-menu"/></svg></button>
        <label class="busca-topo"><svg class="icone"><use href="#i-busca"/></svg><input id="busca-topo" type="search" placeholder="Buscar pedido, cliente ou jogo" autocomplete="off"><kbd>Enter</kbd></label>
        <div class="topo-acoes">
          <button class="icone-btn so-icone toque" id="btn-tema" aria-label="Trocar tema"><svg class="icone"><use href="#i-lua" id="icone-tema"/></svg></button>
          <button class="icone-btn so-icone toque" id="btn-atualizar" aria-label="Buscar pedidos novos"><svg class="icone"><use href="#i-atualizar"/></svg></button>
          <span class="avatar" aria-hidden="true">PA</span>
        </div>
      </header>

      <div class="cab-pagina">
        <div>
          <h1 id="titulo-p">Visão geral</h1>
          <p class="sub-pagina" id="sync-topo"></p>
        </div>
        <div class="periodo-barra" id="periodo-barra">
          <label class="seletor-periodo"><svg class="icone"><use href="#i-calendario"/></svg>
            <select id="periodo" aria-label="Período" autocomplete="off">
              <option value="hoje">Hoje</option>
              <option value="ontem">Ontem</option>
              <option value="7">Últimos 7 dias</option>
              <option value="30">Últimos 30 dias</option>
              <option value="mes">Este mês</option>
              <option value="mes-passado">Mês passado</option>
              <option value="livre">Escolher datas</option>
            </select>
          </label>
          <label class="seletor-periodo so-geral">
            <select id="f-plataforma" aria-label="Plataforma" autocomplete="off">
              <option value="">Todas as plataformas</option>
              <option value="Nintendo">Nintendo</option>
              <option value="PlayStation">PlayStation</option>
              <option value="Steam">Steam</option>
            </select>
          </label>
          <label class="seletor-periodo so-geral">
            <select id="f-metodo" aria-label="Forma de pagamento" autocomplete="off">
              <option value="">Pix e cartão</option>
              <option value="pix">Só Pix</option>
              <option value="card">Só cartão</option>
            </select>
          </label>
          <a class="btn primario toque" id="btn-exportar" download><svg class="icone p"><use href="#i-exportar"/></svg>Exportar</a>
          <div class="datas" id="datas" hidden>
            <input type="date" id="data-de" class="campo-entrada">
            <span>até</span>
            <input type="date" id="data-ate" class="campo-entrada">
          </div>
        </div>
      </div>

      <section class="vista" data-vista="geral">
        <div id="geral"></div>
      </section>

      <section class="vista" data-vista="pedidos" hidden>
        <div class="busca-linha">
          <label class="busca"><svg class="icone p"><use href="#i-busca"/></svg><input id="busca-pedidos" type="search" placeholder="Pedido, cliente, e-mail, telefone ou jogo" autocomplete="off"></label>
          <button class="btn-filtros toque" id="filtros-pedidos" aria-label="Filtros"><svg class="icone"><use href="#i-filtro"/></svg><span class="bolinha" hidden></span></button>
        </div>
        <div class="ativos" id="ativos-pedidos"></div>
        <div id="lista-pedidos"></div>
      </section>

      <section class="vista" data-vista="receber" hidden>
        <p class="legenda">Dinheiro de cartão que ainda vai cair na carteira da Nerix. Pix cai na hora.</p>
        <div id="receber"></div>
      </section>

      <section class="vista" data-vista="despesas" hidden>
        <div class="socios" id="socios"></div>
        <div class="busca-linha">
          <label class="busca"><svg class="icone p"><use href="#i-busca"/></svg><input id="busca-lanc" type="search" placeholder="Buscar lançamento" autocomplete="off"></label>
          <button class="btn-filtros toque" id="filtros-lanc" aria-label="Filtros"><svg class="icone"><use href="#i-filtro"/></svg><span class="bolinha" hidden></span></button>
        </div>
        <div class="ativos" id="ativos-lanc"></div>
        <div id="lista-lanc"></div>
        <details class="fixos" id="fixos"><summary>Custos fixos do mês</summary><div id="lista-fixos"></div></details>
        <button class="fab toque" id="btn-novo" aria-label="Novo lançamento"><svg class="icone"><use href="#i-mais"/></svg></button>
      </section>
    </div>
  </div>

  <div id="folha-veu" class="folha-veu" hidden></div>
  <article id="folha" class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo" hidden>
    <div class="alca"><span></span></div>
    <div class="folha-topo">
      <div class="folha-texto"><h2 id="folha-titulo"></h2><p id="folha-sub"></p></div>
      <button class="icone-btn so-icone toque" data-fechar-folha aria-label="Fechar"><svg class="icone p"><use href="#i-fechar"/></svg></button>
    </div>
    <div class="folha-corpo" id="folha-corpo"></div>
  </article>

  <div id="dialogo-veu" class="dialogo-veu" hidden>
    <div class="dialogo" id="dialogo" role="dialog" aria-modal="true"></div>
  </div>

  <div id="aviso" class="aviso" role="status"></div>
  <script src="/vendor/chart-4.4.6.umd.js"></script>
  <script src="/app.js?v=11"></script>
  <script src="/seletor.js?v=1"></script>
</body>
</html>
